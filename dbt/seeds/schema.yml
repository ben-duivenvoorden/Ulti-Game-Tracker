version: 2

seeds:
  - name: segment_overrides
    description: |
      Manual per-point canonical overrides. Empty by default. Add a row
      (game_id, point_index, canonical_segment_id) to pin a specific segment as
      the canonical record for a point, overriding point_canonical's
      deterministic pick — the human cross-check for a contested / redundant
      point. The pinned segment must actually cover the point, or its events
      drop out of canonical_events.
    config:
      column_types:
        game_id: BIGINT
        point_index: INTEGER
        canonical_segment_id: VARCHAR
