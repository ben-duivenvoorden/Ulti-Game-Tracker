version: 2

models:
  - name: fact_events
    description: |
      One row per non-structural gameplay event. Flattened, denormalised, the
      primary input for Power BI. Excludes undo/amend/truncate/splice-block.
    columns:
      - name: event_id
        tests: [not_null]
      - name: game_id
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - point-start
                  - pull
                  - pull-bonus
                  - brick
                  - possession
                  - turnover-throw-away
                  - turnover-receiver-error
                  - turnover-stall
                  - block
                  - intercept
                  - timeout
                  - goal
                  - injury-sub
                  - half-time
                  - end-game
                  - foul
                  - pick
                  - system
      - name: event_category
        tests:
          - accepted_values:
              arguments:
                values: [scoring, turnover, defensive, pull, possession, lifecycle, meta, other]
      - name: team_id
        tests:
          - accepted_values:
              arguments:
                values: [A, B]
              config:
                where: "team_id is not null"

  - name: fact_points
    description: |
      One row per point played. Aggregates in-point events into counts and
      identifies pulling team, receiving team, scoring team, and outcome
      (hold vs break).
    columns:
      - name: game_id
        tests: [not_null]
      - name: point_index
        tests: [not_null]
      - name: pulling_team
        tests:
          - accepted_values:
              arguments:
                values: [A, B]
              config:
                where: "pulling_team is not null"
      - name: scoring_team
        tests:
          - accepted_values:
              arguments:
                values: [A, B]
              config:
                where: "scoring_team is not null"
      - name: point_outcome
        tests:
          - accepted_values:
              arguments:
                values: [hold, break]
              config:
                where: "point_outcome is not null"

  - name: fact_games
    description: One row per game with score, winner, and total counters.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: winner
        tests:
          - accepted_values:
              arguments:
                values: [A, B, draw]
              config:
                where: "winner is not null"

  - name: dim_players
    description: |
      Per-game player dimension. Key = (game_id, player_id). Anonymisation =
      hashed IDs: player_hash is the public-safe player key; real names are
      never exposed (enforced by the dim_players_no_raw_player_names test).
    columns:
      - name: game_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: player_hash
        tests: [not_null]
      - name: team_id
        tests:
          - accepted_values:
              arguments:
                values: [A, B]

  - name: dim_teams
    description: Per-game team dimension. Key = (game_id, team_id).
    columns:
      - name: game_id
        tests: [not_null]
      - name: team_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [A, B]

  - name: dim_games
    description: Game dimension. Stub — enriched once config snapshot is published alongside the event log.
    columns:
      - name: game_id
        tests: [unique, not_null]
