name: build-data

on:
  schedule:
    - cron: '0 * * * *'      # hourly
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'scripts/**'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:

permissions:
  contents: write              # for `gh release upload`

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Set RAW_EVENTS_URL in repo secrets once Azure Blob exists.
      # If unset, the workflow falls back to scripts/sample-events.csv so it
      # still exercises end-to-end (with sample data) before infra is wired up.
      RAW_EVENTS_URL:   ${{ secrets.RAW_EVENTS_URL || 'scripts/sample-events.csv' }}
      DUCKDB_PATH:      /tmp/ultimate.duckdb
      GOLD_EXPORT_DIR:  /tmp/gold

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-duckdb
        run: pip install --quiet dbt-duckdb

      - name: Prepare output dir
        run: mkdir -p "${GOLD_EXPORT_DIR}"

      - name: Build models
        working-directory: dbt
        run: |
          dbt deps  --profiles-dir .
          dbt build --profiles-dir .

      - name: Export gold tables to gzipped CSV
        working-directory: dbt
        run: dbt run-operation export_gold --profiles-dir .

      - name: Upload to GitHub Release `latest`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest build" \
              --notes "Auto-built data product. Overwritten by each build-data run." \
              --target main
          fi
          gh release upload latest --clobber \
            "${DUCKDB_PATH}" \
            "${GOLD_EXPORT_DIR}"/*.csv.gz

      - name: Trigger Power BI dataset refresh
        env:
          PBI_TENANT_ID:     ${{ secrets.PBI_TENANT_ID }}
          PBI_CLIENT_ID:     ${{ secrets.PBI_CLIENT_ID }}
          PBI_CLIENT_SECRET: ${{ secrets.PBI_CLIENT_SECRET }}
          PBI_WORKSPACE_ID:  ${{ secrets.PBI_WORKSPACE_ID }}
          PBI_DATASET_ID:    ${{ secrets.PBI_DATASET_ID }}
        if: env.PBI_DATASET_ID != ''
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/${PBI_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${PBI_CLIENT_ID}" \
            -d "client_secret=${PBI_CLIENT_SECRET}" \
            -d "scope=https://analysis.windows.net/powerbi/api/.default" \
            -d "grant_type=client_credentials" \
            | jq -r .access_token)
          curl -fsS -X POST \
            "https://api.powerbi.com/v1.0/myorg/groups/${PBI_WORKSPACE_ID}/datasets/${PBI_DATASET_ID}/refreshes" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"Full"}'
