name: deploy-landing

# Deploys the marketing landing page (landing/) to its own Azure Static Web App
# (stapp-ugt-landing-prod-aue, serving ultigametracker.com + www).
#
# Separate SWA from the app SPA (deploy-spa.yml), so it uses its own deployment
# token secret.
#
# One-time setup:
#   az staticwebapp secrets list \
#     --name stapp-ugt-landing-prod-aue -g rg-ugt-prod-aue \
#     --query properties.apiKey -o tsv
#   Save as repo secret AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'landing/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # so the action can post preview-environment comments

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if SWA not configured
        id: gate
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}" ]; then
            echo "Landing SWA token not set — skipping deploy."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          submodules: false
          lfs: false

      - uses: Azure/static-web-apps-deploy@v1
        if: steps.gate.outputs.configured == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          upload
          app_location:                    landing
          api_location:                    ''
          output_location:                 dist
          skip_app_build:                  false
          # Production build picks up landing/.env.production automatically
          # (Vite loads it for `vite build`), so no build-time env vars needed.
