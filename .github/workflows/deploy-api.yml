name: deploy-api

# Deploys the Azure Functions API on push to `main` paths under `api/`.
# Uses OIDC federated identity (no long-lived AZURE_CREDENTIALS secret).
#
# One-time setup:
#   1. Create an Entra ID app registration + federated credential trusting
#      this repo. Easiest: `azd pipeline config` from the repo root after
#      `azd up` has provisioned the resources — it wires the federated
#      credential and sets the repo secrets automatically.
#   2. Or manually: see https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure
#   3. Set GitHub Actions repo *variables* (not secrets):
#        AZURE_FUNCTIONAPP_NAME    e.g. func-ugt-prod-aue
#      and GitHub Actions repo *secrets*:
#        AZURE_CLIENT_ID
#        AZURE_TENANT_ID
#        AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write       # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if Azure not configured
        id: gate
        run: |
          if [ -z "${{ vars.AZURE_FUNCTIONAPP_NAME }}" ] || [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "Azure secrets/vars not set — skipping deploy."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install + build
        if: steps.gate.outputs.configured == 'true'
        working-directory: api
        run: |
          npm ci
          npm run build

      - uses: azure/login@v2
        if: steps.gate.outputs.configured == 'true'
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        if: steps.gate.outputs.configured == 'true'
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package:  api
          # Function runtime auto-detects from host.json + package.json.
